[advisories]
ignore = []

[licenses]
version = 2
# The project license is intentionally outside the scope of the release audit;
# CI allows the root package's missing license metadata explicitly.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
