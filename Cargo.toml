[package]
name = "agentboard"
version = "0.1.0"
edition = "2021"
description = "A TUI task orchestrator for AI agents"
license = "MIT"
repository = "https://github.com/andreas-schneider/agentboard"
homepage = "https://github.com/andreas-schneider/agentboard"
readme = "README.md"
keywords = ["ai", "agents", "tui", "tmux", "git"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE*",
    "NOTICE*",
    "COPYING*",
    "UNLICENSE",
]

[[bin]]
name = "ab"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# TUI
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }

# Utilities
chrono = "0.4"
anyhow = "1"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3.14"
